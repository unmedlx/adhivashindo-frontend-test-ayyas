<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adhivasindo Board</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.esm.js"></script>
<script nomodule src="https://cdn.jsdelivr.net/npm/@ionic/core/dist/ionic/ionic.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@ionic/core/css/ionic.bundle.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{
  /* --- design tokens --- */
  --bg:#fafbfc; --surface:#ffffff; --surface-2:#f4f5f7; --border:#ebedf1;
  --text:#1c2534; --muted:#9aa2b1; --muted-2:#d3d7de;
  --accent:#3d7bfc; --accent2:#2f63e0; --accent-soft:#eaf1ff;
  --danger:#ef4b5f; --danger-soft:#ffe6ea;
  --warn:#f2994a; --warn-soft:#fff2e2;
  --success:#1cc88a;
  --radius-lg:16px; --radius-md:12px; --radius-sm:8px; --radius:var(--radius-md);
  --label-feature-bg:#e7f0ff; --label-feature-text:#3d7bfc;
  --label-bug-bg:#ffe3e9; --label-bug-text:#e6396c;
  --label-issue-bg:#fff1de; --label-issue-text:#e8890f;
  --label-undefined-bg:#eef0f3; --label-undefined-text:#7c8698;
  --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 1px 1px rgba(16,24,40,.03);
  --shadow-pop:0 12px 32px rgba(16,24,40,.14);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#14161c; --surface:#1d2029; --surface-2:#242833; --border:#2b2f3a; --text:#eef0f4; --muted:#8c93a3; --muted-2:#3a3f4c; --accent-soft:#1c2740; } }
:root[data-theme="dark"]{ --bg:#14161c; --surface:#1d2029; --surface-2:#242833; --border:#2b2f3a; --text:#eef0f4; --muted:#8c93a3; --muted-2:#3a3f4c; --accent-soft:#1c2740; }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*{box-sizing:border-box;}
body{ margin:0; background:var(--bg); color:var(--text); font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif; letter-spacing:-.1px; }
ion-toolbar{ --background:var(--surface); --color:var(--text); padding-top:env(safe-area-inset-top,0px); border-bottom:1px solid var(--border); --min-height:58px; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:8px 16px; flex-wrap:wrap; gap:10px; }
.topbar-left{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
.brand{ font-weight:800; font-size:15px; display:flex; align-items:center; gap:7px; cursor:default; }
.brand .logo{ width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),#7c5cfc); box-shadow:0 3px 8px rgba(61,123,252,.35); }
.brand .chev{ color:var(--muted); font-size:10px; margin-left:1px; }
.avatars-mini{ display:flex; align-items:center; }
.avatars-mini .av{ margin-left:-8px; border:2px solid var(--surface); }
.avatars-mini .av:first-child{ margin-left:0; }
.avatars-mini .more{ background:var(--surface-2); color:var(--muted); }
#inviteBtn{ --border-radius:8px; --border-color:var(--border); --color:var(--text); --padding-start:12px; --padding-end:12px; font-weight:600; font-size:12.5px; text-transform:none; height:30px; }
.topbar-right{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.tb-btn{ --border-radius:8px; --border-color:var(--border); --color:var(--muted); --padding-start:11px; --padding-end:11px; font-weight:600; font-size:12.5px; text-transform:none; height:30px; }
.av{ width:28px;height:28px;border-radius:50%; display:flex; align-items:center; justify-content:center; color:#fff; font-size:11px; font-weight:700; flex:none; box-shadow:0 1px 2px rgba(0,0,0,.15); }
.av.sm{ width:22px;height:22px; font-size:9px; }
ion-searchbar{ max-width:250px; --background:var(--surface-2); --border-radius:var(--radius-sm); --box-shadow:none; --color:var(--text); --placeholder-color:var(--muted); --icon-color:var(--muted); }
.filter-wrap{ position:relative; }
#filterBtn{ --border-radius:var(--radius-sm); --border-color:var(--border); --color:var(--text); font-weight:600; text-transform:none; }
.filter-panel{ position:absolute; top:46px; right:0; z-index:50; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-pop); padding:14px; width:250px; display:none; }
.filter-panel.open{ display:block; }
.filter-panel h4{ margin:0 0 8px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; font-weight:700; }
.filter-panel .chip-row{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px; }
.chip{ border:1px solid var(--border); background:var(--surface-2); border-radius:20px; padding:4px 11px; font-size:12px; font-weight:500; cursor:pointer; user-select:none; transition:all .12s; }
.chip.active{ background:var(--accent); color:#fff; border-color:var(--accent); }
.board-wrap{ overflow-x:auto; padding:18px 16px; height:calc(100vh - 58px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); }
.board{ display:flex; gap:16px; align-items:flex-start; min-height:100%; }
.column{ background:transparent; width:272px; flex:none; }
.col-head{ display:flex; align-items:center; justify-content:space-between; padding:2px 6px 12px; }
.col-head .name{ font-weight:700; font-size:13.5px; display:flex; align-items:center; gap:7px; color:var(--text); }
.col-count{ background:var(--surface-2); color:var(--muted); border-radius:10px; padding:1px 8px; font-size:11px; font-weight:600; }
.col-add{ background:var(--surface); border:1px solid var(--border); width:22px;height:22px;border-radius:7px; font-size:15px; color:var(--muted); cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center; }
.col-add:hover{ color:var(--accent); border-color:var(--accent); }
.col-body{ min-height:60px; border-radius:var(--radius-lg); padding:2px; transition:background .15s; }
.col-body.drag-over{ background:var(--accent-soft); outline:2px dashed var(--accent); }
.card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); margin-bottom:10px; box-shadow:var(--shadow-card); cursor:grab; overflow:hidden; transition:transform .12s, box-shadow .12s; }
.card:hover{ box-shadow:0 10px 24px rgba(16,24,40,.1); transform:translateY(-2px); border-color:var(--muted-2); }
.card.dragging{ opacity:.4; }
.card .cover{ height:86px; background-size:cover; background-position:center; }
.card-body{ padding:12px 13px; }
.badge{ display:inline-block; font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:6px; margin-bottom:8px; letter-spacing:.2px; }
.progress-mini{ height:4px; border-radius:2px; background:var(--surface-2); overflow:hidden; margin-bottom:9px; }
.progress-mini > div{ height:100%; background:var(--accent); }
.card-title{ font-size:13.5px; font-weight:600; margin:0 0 4px; line-height:1.35; color:var(--text); }
.card-title.done{ text-decoration:line-through; color:var(--muted); }
.card-desc{ font-size:12px; color:var(--muted); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:9px; line-height:1.4; }
.card-foot{ display:flex; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted); padding-top:8px; border-top:1px solid var(--border); }
.foot-left{ display:flex; align-items:center; gap:9px; }
.foot-left span{ display:flex; align-items:center; gap:3px; font-weight:500; }
.card-avs{ display:flex; }
.card-avs .av{ margin-left:-6px; }
.empty-hint{ font-size:12px; color:var(--muted); padding:14px; border:1.5px dashed var(--border); border-radius:var(--radius-md); text-align:center; }
ion-fab-button{ --background:var(--accent); --background-hover:var(--accent2); --box-shadow:0 8px 20px rgba(61,123,252,.4); }
.add-list-col{ width:250px; flex:none; }
.add-list-btn{ width:100%; background:var(--surface-2); border:1.5px dashed var(--muted-2); border-radius:var(--radius-lg); padding:12px 14px; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; text-align:left; transition:all .12s; }
.add-list-btn:hover{ border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.add-list-form{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:10px; box-shadow:var(--shadow-card); }
.add-list-form input{ width:100%; border:1px solid var(--border); border-radius:var(--radius-sm); padding:8px 10px; font-size:13px; font-family:inherit; outline:none; margin-bottom:8px; background:var(--surface-2); color:var(--text); }
.add-list-form input:focus{ border-color:var(--accent); }
.add-list-form .row{ display:flex; gap:8px; align-items:center; }
.add-list-form .cancel{ background:none; border:none; color:var(--muted); font-size:20px; cursor:pointer; line-height:1; padding:0 6px; }
/* modal */
ion-modal#taskModal{ --border-radius:20px; --width:560px; --height:88%; --box-shadow:var(--shadow-pop); }
ion-modal#taskModal ion-content{ --background:var(--surface); --color:var(--text); }
.det-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; border-bottom:1px solid var(--border); }
#completeBtn{ --border-radius:20px; --border-color:var(--text); --border-width:1.5px; --color:var(--text); font-weight:600; text-transform:none; font-size:12.5px; }
#completeBtn.is-done{ --background:var(--text); --color:var(--surface); }
#closeModalBtn{ --color:var(--muted); font-size:16px; }
.det-body{ padding:18px 20px 6px; overflow-y:auto; }
.cover-drop{ height:150px; border:1.5px dashed var(--border); border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px; font-weight:600; cursor:pointer; background-size:cover; background-position:center; background-color:var(--surface-2); margin-bottom:18px; transition:border-color .12s; }
.cover-drop:hover{ border-color:var(--accent); color:var(--accent); }
#titleInput{ font-family:inherit; }
.field-title{ font-size:11px; color:var(--muted); margin-bottom:5px; font-weight:700; text-transform:uppercase; letter-spacing:.3px; }
.grid2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
.grid2 > div{ background:var(--surface-2); border-radius:var(--radius-sm); padding:9px 11px; border:1px solid transparent; transition:border-color .12s; }
.grid2 > div:focus-within{ border-color:var(--accent); }
.grid2 select, .grid2 input{ width:100%; border:none; background:transparent; color:var(--text); font-size:13px; font-weight:500; outline:none; font-family:inherit; }
.assignee-row{ display:flex; align-items:center; gap:4px; flex-wrap:wrap; }
.add-av{ width:26px;height:26px;border-radius:50%; border:1.5px dashed var(--muted-2); display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer; background:none; font-size:15px; }
.add-av:hover{ border-color:var(--accent); color:var(--accent); }
.member-pop{ position:relative; }
.member-list{ position:absolute; top:32px; left:0; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); box-shadow:var(--shadow-pop); padding:6px; z-index:40; display:none; width:170px; }
.member-list.open{ display:block; }
.member-list label{ display:flex; align-items:center; gap:8px; padding:7px 8px; font-size:12.5px; font-weight:500; border-radius:var(--radius-sm); cursor:pointer; }
.member-list label:hover{ background:var(--surface-2); }
.section{ margin-bottom:20px; }
.section h4{ font-size:13px; font-weight:700; margin:0 0 9px; color:var(--text); }
textarea{ width:100%; min-height:74px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface-2); color:var(--text); padding:10px 12px; font-family:inherit; font-size:13px; resize:vertical; outline:none; }
textarea:focus{ border-color:var(--accent); background:var(--surface); }
.att-item, .sub-item{ display:flex; align-items:center; gap:9px; padding:8px 2px; font-size:13px; border-bottom:1px solid var(--border); }
.att-item:last-child, .sub-item:last-child{ border-bottom:none; }
.att-item .rm, .sub-item .rm{ margin-left:auto; background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; }
.att-item .rm:hover, .sub-item .rm:hover{ color:var(--danger); }
.att-add{ display:flex; gap:6px; margin-top:8px; }
.att-add input{ flex:1; border:1px solid var(--border); border-radius:var(--radius-sm); padding:7px 10px; background:var(--surface-2); color:var(--text); font-size:12.5px; outline:none; }
.dropzone{ border:1.5px dashed var(--border); border-radius:var(--radius-md); padding:16px; text-align:center; font-size:12.5px; color:var(--muted); cursor:pointer; background:var(--surface-2); transition:border-color .12s; }
.dropzone:hover{ border-color:var(--accent); color:var(--accent); }
.chk-progress{ height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; margin:2px 0 10px; }
.chk-progress > div{ height:100%; background:var(--success); transition:width .2s; }
.act-item{ font-size:12px; color:var(--muted); padding:6px 0; border-bottom:1px dashed var(--border); }
.act-item:last-child{ border-bottom:none; }
.det-foot{ display:flex; justify-content:space-between; align-items:center; padding:14px 20px; border-top:1px solid var(--border); background:var(--surface); }
.danger-btn{ --background:transparent; --color:var(--danger); font-weight:600; text-transform:none; }
#discardBtn{ --border-radius:var(--radius-sm); --border-color:var(--border); --color:var(--muted); text-transform:none; font-weight:600; }
#saveBtn{ --border-radius:var(--radius-sm); --background:var(--accent); --background-hover:var(--accent2); text-transform:none; font-weight:700; }
.priority-Low{color:var(--success);} .priority-Medium{color:var(--warn);} .priority-High{color:var(--danger);}
</style>
</head>
<body>
<ion-app>
  <ion-header>
    <ion-toolbar>
      <div class="topbar">
        <div class="topbar-left">
          <div class="brand"><div class="logo"></div> Adhivasindo <span class="chev">▾</span></div>
          <div class="avatars-mini" id="teamMini"></div>
          <ion-button class="tb-btn" id="inviteBtn" fill="outline">+ Invite</ion-button>
        </div>
        <div class="topbar-right">
          <div class="filter-wrap">
            <ion-button class="tb-btn" fill="outline" id="filterBtn">⏷ Filter</ion-button>
            <div class="filter-panel" id="filterPanel">
              <h4>Assignee</h4>
              <div class="chip-row" id="filterAssignees"></div>
              <h4>Label</h4>
              <div class="chip-row" id="filterLabels"></div>
              <h4>Due before</h4>
              <input type="date" id="filterDate" style="width:100%;border:1px solid var(--border);border-radius:8px;padding:6px;background:var(--surface-2);color:var(--text);">
              <ion-button size="small" expand="block" style="margin-top:10px;" id="clearFilterBtn" fill="clear">Clear filters</ion-button>
            </div>
          </div>
          <ion-button class="tb-btn" fill="outline" id="exportBtn">⇅ Export / Import</ion-button>
          <ion-searchbar id="searchBar" placeholder="Search Tasks" debounce="150" style="padding:0;"></ion-searchbar>
        </div>
      </div>
    </ion-toolbar>
  </ion-header>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <ion-modal id="taskModal">
    <ion-content>
      <div class="det-head">
        <ion-button size="small" fill="outline" id="completeBtn">Mark Complete</ion-button>
        <ion-button size="small" fill="clear" id="closeModalBtn">✕</ion-button>
      </div>
      <div class="det-body">
        <input type="file" id="coverInput" accept="image/*" style="display:none;">
        <div class="cover-drop" id="coverDrop">+ Add Cover Image</div>
        <input id="titleInput" placeholder="Judul task" style="width:100%;font-size:19px;font-weight:700;border:none;background:transparent;color:var(--text);outline:none;margin-bottom:14px;">

        <div class="grid2">
          <div>
            <div class="field-title">Assignee</div>
            <div class="assignee-row member-pop">
              <div id="assigneeAvs" class="assignee-row"></div>
              <button class="add-av" id="addAssigneeBtn">+</button>
              <div class="member-list" id="memberList"></div>
            </div>
          </div>
          <div>
            <div class="field-title">Due Date</div>
            <input type="date" id="dueInput">
          </div>
          <div>
            <div class="field-title">Board</div>
            <input value="Northern Light" disabled>
          </div>
          <div>
            <div class="field-title">Column</div>
            <select id="columnInput"></select>
          </div>
          <div>
            <div class="field-title">Label</div>
            <select id="labelInput"></select>
          </div>
          <div>
            <div class="field-title">Priority</div>
            <select id="priorityInput">
              <option value="">—</option><option>Low</option><option>Medium</option><option>High</option>
            </select>
          </div>
        </div>

        <div class="section">
          <h4>Description</h4>
          <textarea id="descInput" placeholder="Tulis deskripsi task..."></textarea>
        </div>

        <div class="section">
          <h4>Attachments</h4>
          <div class="dropzone" id="attDrop">Drag &amp; Drop files here or <b>browse from device</b></div>
          <input type="file" id="attInput" style="display:none;">
          <div id="attList"></div>
        </div>

        <div class="section">
          <h4>Check List</h4>
          <div class="chk-progress"><div id="chkBar" style="width:0%"></div></div>
          <div id="subList"></div>
          <div class="att-add"><input id="subInput" placeholder="Tambah subtask..."><ion-button size="small" id="addSubBtn">Add</ion-button></div>
        </div>

        <div class="section">
          <h4>Activity</h4>
          <div id="actList"></div>
        </div>
      </div>
      <div class="det-foot">
        <ion-button class="danger-btn" fill="clear" id="deleteBtn">Delete</ion-button>
        <div>
          <ion-button fill="outline" id="discardBtn">Discard</ion-button>
          <ion-button id="saveBtn">Save</ion-button>
        </div>
      </div>
    </ion-content>
  </ion-modal>

  <ion-toast id="toast" duration="2000"></ion-toast>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button id="quickAdd">+</ion-fab-button>
  </ion-fab>
</ion-app>

<script>
const MEMBERS=[
  {id:'m1',name:'Dina',color:'#ec4899'},{id:'m2',name:'Bayu',color:'#3b82f6'},
  {id:'m3',name:'Sari',color:'#8b5cf6'},{id:'m4',name:'Rian',color:'#10b981'},{id:'m5',name:'Fajar',color:'#f97316'}
];
const LABELS={
  Feature:{bg:'var(--label-feature-bg)',text:'var(--label-feature-text)'},
  Bug:{bg:'var(--label-bug-bg)',text:'var(--label-bug-text)'},
  Issue:{bg:'var(--label-issue-bg)',text:'var(--label-issue-text)'},
  Undefined:{bg:'var(--label-undefined-bg)',text:'var(--label-undefined-text)'}
};
const COLS_KEY='adhivasindo_columns_v1';
let COLS = JSON.parse(localStorage.getItem(COLS_KEY)||'null') || ['To Do','Doing','Review','Done','Rework'];
function saveCols(){ localStorage.setItem(COLS_KEY, JSON.stringify(COLS)); }
const KEY='adhivasindo_kanban_v1';

function initials(n){return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();}
function avatarEl(m,cls){const d=document.createElement('div');d.className='av '+(cls||'');d.style.background=m.color;d.textContent=initials(m.name);d.title=m.name;return d;}

function seed(){
  const t=(title,col,label,assignees,due,desc,checklist)=>({id:crypto.randomUUID(),title,columnId:col,label,assignees,dueDate:due,description:desc||'',checklist:(checklist||[]).map(x=>({id:crypto.randomUUID(),text:x,done:false})),attachments:[],cover:null,priority:'',completed:false,activity:[{ts:Date.now(),text:'Task dibuat'}]});
  return [
    t('Research for a podcast and video website','To Do','Feature',['m4','m5'],'2026-08-08','Riset kompetitor & referensi format konten.'),
    t('Debug checkout process for the e-commerce website','To Do','Bug',['m1','m2','m3'],'2026-10-19','Perbaiki bug pada proses checkout.'),
    t('Design wireframes for the landing page revamp','Doing','Feature',['m4','m5'],'2026-08-12','Wireframe halaman landing baru.'),
    t('Install and set up a marketing tool for team operations','Doing','Undefined',['m1','m2','m3'],'2026-08-14','Setup tools marketing internal.',['Pilih tool','Setup akun','Integrasi']),
    t('Create and refine logo designs for the UI brand','Review','Issue',['m4','m5'],'2026-09-02','Revisi logo brand utama.',['Draft 1','Draft 2','Approval']),
    t('Create an icon library for the project','Review','Feature',['m4'],'2026-08-08','Kumpulkan & rapikan icon set.'),
    t('Create the Email Page layout and necessary components','Done','Feature',['m1','m2'],'2026-08-01','Layout halaman email selesai dibuat.'),
    t('Enhance website usability through user feedback','Done','Feature',['m4','m5'],'2026-08-05','Implementasi feedback user.'),
    t('Blog Edit Page Modification and Playlist Page Design','Rework','Feature',['m1','m2','m3'],'2026-08-08','Revisi halaman blog & playlist.'),
    t('Plan and execute training sessions for new hires','Rework','Issue',['m4','m5'],'2026-08-09','Susun jadwal training karyawan baru.')
  ];
}
let tasks = JSON.parse(localStorage.getItem(KEY)||'null') || seed();
function save(){ localStorage.setItem(KEY, JSON.stringify(tasks)); }

let filters={assignees:new Set(),labels:new Set(),date:''};
let editing=null; // task being edited in modal, or null=new

function matchesFilter(t){
  const q=document.getElementById('searchBar').value.toLowerCase();
  if(q && !(t.title.toLowerCase().includes(q)||t.description.toLowerCase().includes(q))) return false;
  if(filters.assignees.size && ![...filters.assignees].some(a=>t.assignees.includes(a))) return false;
  if(filters.labels.size && !filters.labels.has(t.label)) return false;
  if(filters.date && (!t.dueDate || t.dueDate>filters.date)) return false;
  return true;
}

function render(){
  const board=document.getElementById('board'); board.innerHTML='';
  COLS.forEach(col=>{
    const list=tasks.filter(t=>t.columnId===col && matchesFilter(t));
    const colEl=document.createElement('div'); colEl.className='column';
    colEl.innerHTML=`<div class="col-head"><div class="name">${col} <span class="col-count">${list.length}</span></div><button class="col-add" data-col="${col}">+</button></div>`;
    const body=document.createElement('div'); body.className='col-body'; body.dataset.col=col;
    if(!list.length) body.innerHTML='<div class="empty-hint">Tidak ada task</div>';
    list.forEach(t=> body.appendChild(cardEl(t)) );
    body.addEventListener('dragover',e=>{e.preventDefault(); body.classList.add('drag-over');});
    body.addEventListener('dragleave',()=>body.classList.remove('drag-over'));
    body.addEventListener('drop',e=>{
      e.preventDefault(); body.classList.remove('drag-over');
      const id=e.dataTransfer.getData('text/plain');
      const task=tasks.find(x=>x.id===id);
      if(task && task.columnId!==col){ task.columnId=col; task.activity.push({ts:Date.now(),text:'Dipindahkan ke '+col}); save(); render(); toast('Task dipindahkan ke '+col); }
    });
    colEl.appendChild(body); board.appendChild(colEl);
  });
  board.appendChild(addListColEl());
  board.querySelectorAll('.col-add').forEach(b=>b.onclick=()=>openModal(null,b.dataset.col));
  renderTeamMini();
}

function addListColEl(){
  const wrap=document.createElement('div'); wrap.className='add-list-col';
  wrap.innerHTML='<button class="add-list-btn" id="addListBtn">＋ Add new list</button>';
  wrap.querySelector('#addListBtn').onclick=()=>{
    wrap.innerHTML=`<div class="add-list-form"><input id="newListInput" placeholder="Nama list..." autofocus><div class="row"><ion-button size="small" id="confirmListBtn">Add List</ion-button><button class="cancel" id="cancelListBtn">✕</button></div></div>`;
    const inp=wrap.querySelector('#newListInput'); inp.focus();
    const commit=()=>{
      const name=inp.value.trim();
      if(name && !COLS.includes(name)){ COLS.push(name); saveCols(); render(); toast('List "'+name+'" ditambahkan'); }
      else render();
    };
    wrap.querySelector('#confirmListBtn').onclick=commit;
    wrap.querySelector('#cancelListBtn').onclick=()=>render();
    inp.addEventListener('keydown',e=>{ if(e.key==='Enter') commit(); if(e.key==='Escape') render(); });
  };
  return wrap;
}

function cardEl(t){
  const el=document.createElement('div'); el.className='card'; el.draggable=true;
  el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',t.id); el.classList.add('dragging');});
  el.addEventListener('dragend',()=>el.classList.remove('dragging'));
  el.onclick=()=>openModal(t);
  let html='';
  if(t.cover) html+=`<div class="cover" style="background-image:url('${t.cover}')"></div>`;
  html+='<div class="card-body">';
  html+=`<span class="badge" style="background:${LABELS[t.label].bg};color:${LABELS[t.label].text}">${t.label}</span>`;
  const done=t.checklist.filter(c=>c.done).length, total=t.checklist.length;
  if(total) html+=`<div class="progress-mini"><div style="width:${Math.round(done/total*100)}%"></div></div>`;
  html+=`<p class="card-title ${t.completed?'done':''}">${t.title}</p>`;
  if(t.description) html+=`<p class="card-desc">${t.description}</p>`;
  html+='<div class="card-foot"><div class="foot-left">';
  if(t.dueDate) html+=`<span>📅 ${t.dueDate.slice(5)}</span>`;
  if(t.attachments.length) html+=`<span>📎 ${t.attachments.length}</span>`;
  html+='</div><div class="card-avs">';
  t.assignees.forEach(id=>{const m=MEMBERS.find(x=>x.id===id); if(m) html+=`<div class="av sm" style="background:${m.color}">${initials(m.name)}</div>`;});
  html+='</div></div></div>';
  el.innerHTML=html;
  return el;
}

function renderTeamMini(){
  const box=document.getElementById('teamMini'); if(!box) return; box.innerHTML='';
  const shown=MEMBERS.slice(0,4);
  shown.forEach(m=>box.appendChild(avatarEl(m)));
  if(MEMBERS.length>shown.length){
    const d=document.createElement('div'); d.className='av more'; d.textContent='+'+(MEMBERS.length-shown.length);
    box.appendChild(d);
  }
}

// ---- Filter panel ----
const filterPanel=document.getElementById('filterPanel');
document.getElementById('filterBtn').onclick=()=>filterPanel.classList.toggle('open');
document.getElementById('searchBar').addEventListener('ionInput',render);
function buildFilterChips(){
  const aWrap=document.getElementById('filterAssignees'); aWrap.innerHTML='';
  MEMBERS.forEach(m=>{
    const c=document.createElement('div'); c.className='chip'; c.textContent=m.name;
    c.onclick=()=>{ filters.assignees.has(m.id)?filters.assignees.delete(m.id):filters.assignees.add(m.id); c.classList.toggle('active'); render(); };
    aWrap.appendChild(c);
  });
  const lWrap=document.getElementById('filterLabels'); lWrap.innerHTML='';
  Object.keys(LABELS).forEach(l=>{
    const c=document.createElement('div'); c.className='chip'; c.textContent=l;
    c.onclick=()=>{ filters.labels.has(l)?filters.labels.delete(l):filters.labels.add(l); c.classList.toggle('active'); render(); };
    lWrap.appendChild(c);
  });
}
document.getElementById('filterDate').addEventListener('input',e=>{filters.date=e.target.value; render();});
document.getElementById('clearFilterBtn').onclick=()=>{
  filters={assignees:new Set(),labels:new Set(),date:''};
  document.getElementById('filterDate').value='';
  buildFilterChips(); render();
};

// ---- Modal ----
const modal=document.getElementById('taskModal');
let tempAssignees=[], tempChecklist=[], tempAttachments=[], tempCover=null, tempActivity=[], tempCompleted=false;

function fillColumnSelect(){
  const sel=document.getElementById('columnInput'); sel.innerHTML='';
  COLS.forEach(c=>sel.innerHTML+=`<option value="${c}">${c}</option>`);
}
function fillLabelSelect(){
  const sel=document.getElementById('labelInput'); sel.innerHTML='';
  Object.keys(LABELS).forEach(l=>sel.innerHTML+=`<option value="${l}">${l}</option>`);
}

function openModal(task, presetCol){
  editing=task;
  document.getElementById('titleInput').value=task?task.title:'';
  document.getElementById('descInput').value=task?task.description:'';
  document.getElementById('dueInput').value=task?task.dueDate||'':'';
  document.getElementById('priorityInput').value=task?task.priority||'':'';
  fillColumnSelect(); fillLabelSelect();
  document.getElementById('columnInput').value=task?task.columnId:(presetCol||COLS[0]);
  document.getElementById('labelInput').value=task?task.label:'Feature';
  tempAssignees=task?[...task.assignees]:[];
  tempChecklist=task?JSON.parse(JSON.stringify(task.checklist)):[];
  tempAttachments=task?[...task.attachments]:[];
  tempCover=task?task.cover:null;
  tempActivity=task?[...task.activity]:[{ts:Date.now(),text:'Task dibuat'}];
  tempCompleted=task?!!task.completed:false;
  document.getElementById('deleteBtn').style.display=task?'inline-block':'none';
  renderCover(); renderAssignees(); renderChecklist(); renderAttachments(); renderActivity(); updateCompleteBtn();
  modal.present();
}
function updateCompleteBtn(){ const b=document.getElementById('completeBtn'); b.textContent= tempCompleted?'Completed ✓':'Mark Complete'; b.classList.toggle('is-done',tempCompleted); }
document.getElementById('completeBtn').onclick=()=>{ tempCompleted=!tempCompleted; updateCompleteBtn(); };
document.getElementById('closeModalBtn').onclick=()=>modal.dismiss();
document.getElementById('discardBtn').onclick=()=>modal.dismiss();

function renderCover(){
  const d=document.getElementById('coverDrop');
  if(tempCover){ d.style.backgroundImage=`url('${tempCover}')`; d.textContent=''; } else { d.style.backgroundImage=''; d.textContent='+ Add Cover Image'; }
}
document.getElementById('coverDrop').onclick=()=>document.getElementById('coverInput').click();
document.getElementById('coverInput').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ tempCover=r.result; renderCover(); }; r.readAsDataURL(f);
};

function renderAssignees(){
  const wrap=document.getElementById('assigneeAvs'); wrap.innerHTML='';
  tempAssignees.forEach(id=>{const m=MEMBERS.find(x=>x.id===id); if(m) wrap.appendChild(avatarEl(m));});
  const ml=document.getElementById('memberList'); ml.innerHTML='';
  MEMBERS.forEach(m=>{
    const lbl=document.createElement('label');
    lbl.innerHTML=`<input type="checkbox" ${tempAssignees.includes(m.id)?'checked':''}> ${m.name}`;
    lbl.querySelector('input').onchange=e=>{
      if(e.target.checked) tempAssignees.push(m.id); else tempAssignees=tempAssignees.filter(x=>x!==m.id);
      renderAssignees();
    };
    ml.appendChild(lbl);
  });
}
document.getElementById('addAssigneeBtn').onclick=e=>{ e.stopPropagation(); document.getElementById('memberList').classList.toggle('open'); };
document.addEventListener('click',e=>{
  if(!e.target.closest('.member-pop')) document.getElementById('memberList').classList.remove('open');
  if(!e.target.closest('.filter-wrap')) filterPanel.classList.remove('open');
});

function renderChecklist(){
  const wrap=document.getElementById('subList'); wrap.innerHTML='';
  tempChecklist.forEach(c=>{
    const row=document.createElement('div'); row.className='sub-item';
    row.innerHTML=`<input type="checkbox" ${c.done?'checked':''}> <span style="${c.done?'text-decoration:line-through;color:var(--muted)':''}">${c.text}</span><button class="rm">✕</button>`;
    row.querySelector('input').onchange=e=>{ c.done=e.target.checked; renderChecklist(); };
    row.querySelector('.rm').onclick=()=>{ tempChecklist=tempChecklist.filter(x=>x.id!==c.id); renderChecklist(); };
    wrap.appendChild(row);
  });
  const done=tempChecklist.filter(c=>c.done).length, total=tempChecklist.length;
  document.getElementById('chkBar').style.width=(total?Math.round(done/total*100):0)+'%';
}
document.getElementById('addSubBtn').onclick=()=>{
  const inp=document.getElementById('subInput'); if(!inp.value.trim()) return;
  tempChecklist.push({id:crypto.randomUUID(),text:inp.value.trim(),done:false}); inp.value=''; renderChecklist();
};

function renderAttachments(){
  const wrap=document.getElementById('attList'); wrap.innerHTML='';
  tempAttachments.forEach((name,i)=>{
    const row=document.createElement('div'); row.className='att-item';
    row.innerHTML=`📄 ${name}<button class="rm">✕</button>`;
    row.querySelector('.rm').onclick=()=>{ tempAttachments.splice(i,1); renderAttachments(); };
    wrap.appendChild(row);
  });
}
document.getElementById('attDrop').onclick=()=>document.getElementById('attInput').click();
document.getElementById('attInput').onchange=e=>{
  const f=e.target.files[0]; if(!f) return; tempAttachments.push(f.name); renderAttachments();
};

function renderActivity(){
  const wrap=document.getElementById('actList'); wrap.innerHTML='';
  [...tempActivity].reverse().forEach(a=>{
    const row=document.createElement('div'); row.className='act-item';
    row.textContent=new Date(a.ts).toLocaleString('id-ID')+' — '+a.text;
    wrap.appendChild(row);
  });
}

document.getElementById('saveBtn').onclick=()=>{
  const title=document.getElementById('titleInput').value.trim();
  if(!title){ toast('Judul task wajib diisi','danger'); return; }
  const data={
    title, description:document.getElementById('descInput').value,
    columnId:document.getElementById('columnInput').value,
    label:document.getElementById('labelInput').value,
    priority:document.getElementById('priorityInput').value,
    dueDate:document.getElementById('dueInput').value,
    assignees:tempAssignees, checklist:tempChecklist, attachments:tempAttachments,
    cover:tempCover, completed:tempCompleted
  };
  if(editing){
    tempActivity.push({ts:Date.now(),text:'Task diperbarui'});
    Object.assign(editing,data,{activity:tempActivity});
    toast('Task berhasil diperbarui');
  } else {
    tasks.push({id:crypto.randomUUID(),...data,activity:tempActivity});
    toast('Task berhasil dibuat');
  }
  save(); modal.dismiss(); render();
};
document.getElementById('deleteBtn').onclick=()=>{
  if(editing){ tasks=tasks.filter(t=>t.id!==editing.id); save(); modal.dismiss(); render(); toast('Task dihapus','danger'); }
};
document.getElementById('quickAdd').onclick=()=>openModal(null,COLS[0]);
document.getElementById('inviteBtn').onclick=()=>toast('Fitur invite anggota akan segera hadir');
document.getElementById('exportBtn').onclick=()=>toast('Fitur export/import akan segera hadir');

function toast(msg,color){
  const t=document.getElementById('toast'); t.message=msg; t.color=color||'success'; t.position='top'; t.present();
}

buildFilterChips(); render();
</script>
</body>
</html>
